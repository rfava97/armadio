name: Keep-alive Supabase

# Il piano Free mette in pausa il progetto dopo 7 giorni di inattività.
on:
  schedule:
    - cron: '17 6 */3 * *' # ogni 3 giorni alle 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: SELECT leggera su garments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/garments?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}")
          echo "HTTP $status"
          cat /tmp/body.txt; echo
          test "$status" = "200"
